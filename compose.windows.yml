# Local stack for Podman on Windows (WSL machine).
#
# Podman 6.0 on WSL publishes container ports only as firewall (DNAT) rules, which WSL
# can't forward to Windows. Here every service uses host networking and listens on
# 127.0.0.1 inside the WSL VM; WSL forwards those real sockets to Windows localhost.
#
#   npm run podman:up:windows   → app http://localhost:3004 · inbox http://localhost:18026
#   npm run podman:down:windows
#
# Same ports as compose.yml; use one file or the other, not both at once.
name: slotwell
services:
  app:
    build: .
    network_mode: host
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3004"
      DATABASE_URL: "postgresql://${DB_USER:-slotwell_user}:${DB_PASSWORD}@127.0.0.1:5433/${DB_NAME:-slotwell}"
      APP_URL: http://localhost:3004
      BETTER_AUTH_URL: http://localhost:3004
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1026"
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-none}
      DEV_PASSWORD_LOGIN: ${DEV_PASSWORD_LOGIN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: docker.io/library/postgres:17-alpine
    network_mode: host
    command: ["postgres", "-p", "5433", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: ${DB_NAME:-slotwell}
      POSTGRES_USER: ${DB_USER:-slotwell_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
    volumes:
      - slotwell_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: docker.io/axllent/mailpit:v1.29
    network_mode: host
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1026
      MP_UI_BIND_ADDR: 127.0.0.1:18026
volumes:
  slotwell_postgres_data:
